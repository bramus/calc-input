<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 340" width="100%" height="100%">
  <style>
    .bg { fill: #f8fafc; rx: 12px; }
    .host-box { fill: #ffffff; stroke: #059669; stroke-width: 2; stroke-dasharray: 6 4; rx: 10px; }
    .card { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.5; rx: 8px; }
    .card-active { fill: #eff6ff; stroke: #2563eb; stroke-width: 2; rx: 8px; }
    .card-result { fill: #f0fdf4; stroke: #16a34a; stroke-width: 2; rx: 8px; }
    .card-hidden { fill: #f1f5f9; stroke: #94a3b8; stroke-width: 1.5; stroke-dasharray: 4 3; rx: 8px; }
    .title { font: 700 15px ui-monospace, SFMono-Regular, Menlo, monospace; fill: #0f172a; }
    .subtitle { font: 600 12px system-ui, -apple-system, sans-serif; fill: #475569; }
    .code { font: 600 13px ui-monospace, SFMono-Regular, Menlo, monospace; fill: #1e293b; }
    .badge-host { fill: #d1fae5; }
    .badge-host-text { font: 700 12px ui-monospace, SFMono-Regular, Menlo, monospace; fill: #065f46; }
    .badge-blue { fill: #dbeafe; }
    .badge-blue-text { font: 700 11px system-ui, -apple-system, sans-serif; fill: #1e40af; }
    .badge-green { fill: #dcfce7; }
    .badge-green-text { font: 700 11px system-ui, -apple-system, sans-serif; fill: #166534; }
    .badge-slate { fill: #e2e8f0; }
    .badge-slate-text { font: 700 11px system-ui, -apple-system, sans-serif; fill: #334155; }
  </style>

  <rect class="bg" x="0" y="0" width="1120" height="340" />

  <!-- Outer Host Element -->
  <rect class="host-box" x="24" y="24" width="1072" height="292" />
  <rect class="badge-host" x="42" y="12" width="380" height="26" rx="6" />
  <text class="badge-host-text" x="54" y="29">&lt;formula-input name="size" value="2 + 3"&gt;</text>

  <!-- Input 1: Main Input (Always Hidden) -->
  <g transform="translate(48, 64)">
    <rect class="card-hidden" x="0" y="0" width="320" height="224" />
    <rect class="badge-slate" x="16" y="16" width="128" height="24" rx="12" />
    <text class="badge-slate-text" x="30" y="32">Always [hidden]</text>
    <text class="title" x="16" y="68">&lt;input type="text"&gt;</text>
    <text class="code" x="16" y="96">name="size"</text>
    <text class="subtitle" x="16" y="130">Configurable via submit attribute:</text>
    <text class="code" x="16" y="156">submit="formula" → "2 + 3"</text>
    <text class="code" x="16" y="180">submit="result"  → "5"</text>
    <text class="subtitle" x="16" y="208">Default: "formula"</text>
  </g>

  <!-- Input 2: Formula Input (Visible on Focus or Invalid) -->
  <g transform="translate(400, 64)">
    <rect class="card-active" x="0" y="0" width="320" height="224" />
    <rect class="badge-blue" x="16" y="16" width="214" height="24" rx="12" />
    <text class="badge-blue-text" x="28" y="32">Visible on :focus (or :invalid)</text>
    <text class="title" x="16" y="68">&lt;input type="text"&gt;</text>
    <text class="code" x="16" y="96">name="size--formula"</text>
    <text class="subtitle" x="16" y="130">Always holds entered formula:</text>
    <rect class="card" x="16" y="144" width="288" height="40" />
    <text class="code" x="30" y="169">2 + 3</text>
    <text class="subtitle" x="16" y="208">Sets setCustomValidity() if unparsable</text>
  </g>

  <!-- Input 3: Result Input (Visible on Blur when Valid) -->
  <g transform="translate(752, 64)">
    <rect class="card-result" x="0" y="0" width="320" height="224" />
    <rect class="badge-green" x="16" y="16" width="186" height="24" rx="12" />
    <text class="badge-green-text" x="28" y="32">Visible on blur (when valid)</text>
    <text class="title" x="16" y="68">&lt;input type="text"&gt;</text>
    <text class="code" x="16" y="96">name="size--result"</text>
    <text class="subtitle" x="16" y="130">Always holds calculated result:</text>
    <rect class="card" x="16" y="144" width="288" height="40" />
    <text class="code" x="30" y="169">5</text>
    <text class="subtitle" x="16" y="208">Clicking/focusing switches to formula</text>
  </g>
</svg>
